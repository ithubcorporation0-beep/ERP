# Production compose file. This is intentionally separate from Sail's dev
# docker-compose.yml (php artisan serve + SQLite for local work) - see
# DEPLOY.md for the exact commands to build and run this.
#
# Docker Compose reads the project-root .env file for two DIFFERENT
# purposes here, which is worth being explicit about:
#   1. `env_file: .env` on the app service loads it as the CONTAINER's
#      runtime environment (what Laravel's config/*.php files read via
#      env()).
#   2. Compose ALSO auto-loads a file literally named `.env` next to this
#      compose file for ${VAR} substitution *inside this YAML itself* -
#      that's what resolves ${DB_DATABASE} etc. below into the mysql
#      service's MYSQL_* variables, so the app and the database always
#      agree on credentials without duplicating them under two names.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    # Not published to the host on purpose - only the app container talks
    # to it, over the internal compose network. Use an SSH tunnel if you
    # need to reach it directly from outside the host.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  db-data:
  app-storage:
