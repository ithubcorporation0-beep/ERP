name: Tests

on:
  push:
    branches:
      - master
      - '*.x'
      - claude/intelligent-hypatia-gxj9ma
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      # This app only ever targets PHP 8.4 (both Dockerfile and
      # Dockerfile.vercel pin php:8.4/dunglas/frankenphp:*-php8.4-*), so a
      # multi-version matrix here tests versions this app doesn't actually
      # run on. composer.lock's resolved dependency graph now requires
      # 8.4+ too (see composer.json's `php` constraint), so 8.2/8.3 jobs
      # would fail on `composer install` regardless.
      matrix:
        php: [8.4]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute tests
        run: vendor/bin/pest
