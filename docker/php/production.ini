; Never show errors to visitors in production - Laravel's own APP_DEBUG=false
; error page (resources/views/errors/500.blade.php) handles that instead.
display_errors=Off
display_startup_errors=Off
expose_php=Off

; Matches StoreDocumentRequest's 20MB per-file document limit (the
; largest upload this app accepts) plus headroom, and nginx's
; client_max_body_size below.
upload_max_filesize=25M
post_max_size=25M
max_file_uploads=20

memory_limit=256M
max_execution_time=60

date.timezone=UTC
