; Opcache, enabled for production. validate_timestamps=0 means PHP never
; re-stats source files to check for changes - correct for a production
; image where a deploy is always a fresh container, never an in-place file
; edit, but means the container MUST be recreated (not just have its code
; changed underneath it) for a code change to take effect.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.jit=tracing
opcache.jit_buffer_size=64M
